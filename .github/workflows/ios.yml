name: iOS
on:
  push:
    branches: [main, 'feat/**']
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared model tests
        run: ./gradlew -p shared jvmTest
      - name: Build and test on iPhone
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcodebuild test -project ios/ClearView.xcodeproj -scheme ClearView -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Export UI screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
            screenshots
      - name: Compact iPhone discovery checks
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; phones=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]]; preferred=next((d for name in ["iPhone SE (3rd generation)", "iPhone 16e", "iPhone 16"] for d in phones if d["name"] == name), phones[-1]); print(preferred["udid"])')
          xcodebuild test -project ios/ClearView.xcodeproj -scheme ClearView -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:ClearViewUITests/DiscoveryUITests -resultBundlePath TestResultsCompact.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-compact.log
      - name: Export compact screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path TestResultsCompact.xcresult --output-path screenshots-compact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-compact-results
          path: |
            TestResultsCompact.xcresult
            xcodebuild-compact.log
            screenshots-compact
