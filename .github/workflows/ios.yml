name: iOS
on:
  push:
    branches: [main, 'feat/**']
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared model tests
        run: ./gradlew -p shared jvmTest
      - name: Build and test on iPhone
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcodebuild test -project ios/ClearView.xcodeproj -scheme ClearView -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
