# Build settings for the shared Kotlin Multiplatform module.
#
# This module declares iosArm64 and iosSimulatorArm64 targets for portability
# (an Apple-silicon Mac or a CI runner builds them), but this development machine
# is an Intel Mac (macos-x86_64), so their TEST tasks cannot run here. Gradle
# warns about each one on every build. The declaration is deliberate, so the
# warning is noise — this suppresses it rather than removing the targets.
#
# It does NOT hide anything that matters: the same warning would appear for a
# genuinely misconfigured target, and `linkDebugFrameworkIosArm64` still runs
# (only *test execution* needs a matching host).
kotlin.native.ignoreDisabledTargets=true
